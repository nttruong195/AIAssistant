server.port=8080
spring.application.name=finance-calculator

# ==============================
# Database (H2 local / PostgreSQL prod)
# ==============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:careeraidb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Claude API key (cho Shop Agent)
ai.claude.api-key=${AI_CLAUDE_API_KEY:}

# CORS - thêm URL frontend khi deploy (cách nhau bởi dấu phẩy)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==============================
# Mail (Gmail SMTP)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.to=ai.assistant.1995@gmail.com

# ==============================
# AI Providers (free tier)
# ==============================
# 1. Google Gemini — aistudio.google.com
ai.gemini.api-key=${AI_GEMINI_API_KEY:}

# 2. Groq — console.groq.com
ai.groq.api-key=${AI_GROQ_API_KEY:}

# 3. Together AI — api.together.xyz (model :free)
ai.together.api-key=${AI_TOGETHER_API_KEY:}

# 4. HuggingFace — huggingface.co (free inference API)
ai.huggingface.api-key=${AI_HUGGINGFACE_API_KEY:}

# 5. Cohere — cohere.com (1,000 req/tháng free)
ai.cohere.api-key=${AI_COHERE_API_KEY:}

# 6. OpenRouter — openrouter.ai (có model free)
ai.openrouter.api-key=${AI_OPENROUTER_API_KEY:}
