services:
  - type: web
    name: finance-calculator-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: AI_GROQ_API_KEY
        sync: false
      - key: AI_HUGGINGFACE_API_KEY
        sync: false
      - key: AI_COHERE_API_KEY
        sync: false
      - key: AI_OPENROUTER_API_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://ai-assistant-six-wine.vercel.app,https://assistantai.js.org
