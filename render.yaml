services:
  - type: web
    name: finance-calculator-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: AI_GROQ_API_KEY
        sync: false
      - key: AI_OPENROUTER_API_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
